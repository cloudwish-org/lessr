# Tag a version, get binaries. See docs/RELEASE.md for the steps that happen
# before this runs (bench green, paired A/B results committed, version bumped).
#
# The artefact names here are a contract with install.sh, which fetches
# `lessr-<target>.tar.gz` and `lessr-<target>.tar.gz.sha256` from the release.
# Change one and you must change the other.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS runners are arm64; the x86_64 build is a cross-compile, which
          # needs no extra tooling on macOS.
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # musl so one binary runs on any distribution, glibc or not.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl tooling
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release -p lessr-cli --target ${{ matrix.target }}
          else
            cargo build --release -p lessr-cli --target ${{ matrix.target }}
          fi

      # The release profile already strips; this only packages.
      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -eu
          bin="target/${{ matrix.target }}/release/lessr"
          archive="lessr-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C "$(dirname "$bin")" lessr
          # `shasum` on macOS, `sha256sum` on Linux; install.sh reads the first
          # field of this file and nothing else.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "lessr-${{ matrix.target }}.zip"
          Compress-Archive -Path "target/${{ matrix.target }}/release/lessr.exe" -DestinationPath $archive
          (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() + "  " + $archive |
            Out-File -Encoding ascii "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: lessr-${{ matrix.target }}
          path: |
            lessr-${{ matrix.target }}.tar.gz
            lessr-${{ matrix.target }}.tar.gz.sha256
            lessr-${{ matrix.target }}.zip
            lessr-${{ matrix.target }}.zip.sha256
          if-no-files-found: ignore

  publish:
    name: github release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true

  # Publishing to crates.io is a one-way door: a version can be yanked but
  # never replaced. It runs only after the binaries exist, and in dependency
  # order, because crates.io rejects a crate whose dependencies are not there.
  crates-io:
    name: crates.io
    needs: publish
    runs-on: ubuntu-latest
    if: ${{ vars.PUBLISH_CRATES == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -eu
          for crate in lessr-core lessr-packs lessr-gate lessr-dedup \
                       lessr-detect lessr-receipt lessr-proxy lessr-adapters \
                       lessr-cli; do
            cargo publish -p "$crate" --locked
            # crates.io needs a moment before a dependent crate can see it.
            sleep 30
          done

# NOT IMPLEMENTED, deliberately. docs/RELEASE.md also lists code signing, a
# Homebrew tap, an npm shim and winget. Each needs credentials and a second
# repository that do not exist yet, and a step that looks real but silently
# does nothing is worse than an absent one. They go here when the accounts do:
#
#   signing        macOS notarisation: APPLE_CERTIFICATE, APPLE_ID,
#                  APPLE_TEAM_ID, APPLE_APP_PASSWORD
#   homebrew       a lessr-dev/homebrew-tap repository, HOMEBREW_TAP_TOKEN
#   npm shim       an @lessr/cli package, NPM_TOKEN
#   winget         winget-pkgs fork + WINGET_TOKEN
