# End-to-end `lessr hook claude` invocation, process spawn included. This is the
# install-level sanity gate, not the per-stage contract in [overhead]: every tool
# call the agent makes pays this once, so it catches a hook path that started
# parsing TOML or opening a database (see technique 7 in docs/PERFORMANCE.md).
#
# Measured, not guessed. On one Linux dev box, 200 samples after 20 warm-ups,
# against the release binary: p50 1.70 ms, p99 2.33 ms. A bare Rust binary that
# only echoes stdin costs p50 1.6 ms / p99 2.0 ms on the same box, so almost all
# of it is fork + exec, and Lessr's own hook work is roughly 0.2 ms.
#
# The budget is ~4x the measured p99. That is deliberately loose: GitHub's
# runners are slower and noisier than a dev box, and macOS has the more
# expensive exec path of the two platforms we gate on. It is tight enough that
# the regression this gate exists to catch — synchronous I/O appearing on the
# hook path, which costs milliseconds, not microseconds — fails it.
#
# Re-measure with:
#   cargo build --release -p lessr-cli && cargo bench -p lessr-bench --bench overhead
# Tighten these once a few real CI runs show how much spread the runners have.
[end_to_end]
p99_ms = 10
p50_ms = 5
fixture = "claude-post-tool-use"
