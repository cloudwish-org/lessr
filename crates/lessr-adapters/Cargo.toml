[package]
name = "lessr-adapters"
description = "Per-agent config knowledge: lessr init, lessr hook <agent>, rtk chaining, uninstall."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
blake3 = "1.8.7"
bytes = "1.12.1"
lessr-core = { path = "../lessr-core", version = "0.1.0" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
shlex = "2.0.1"
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
