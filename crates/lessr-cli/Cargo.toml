[package]
name = "lessr-cli"
description = "The lessr binary and the run(PipelineBuilder) entry point the Pro binary reuses."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[lints]
workspace = true

[[bin]]
name = "lessr"
path = "src/main.rs"

[dependencies]
lessr-core = { path = "../lessr-core", version = "0.1.0" }
lessr-adapters = { path = "../lessr-adapters", version = "0.1.0" }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }

[dev-dependencies]
bytes = "1.12.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tempfile = "3.27.0"
